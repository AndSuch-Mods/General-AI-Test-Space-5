name: Prepare landscape release
on:
  push:
    branches: [deadblock-landscape-prep-1-2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: landscape-release
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve source transfer for verification
        run: |
          mkdir -p test-results
          git archive --format=tar HEAD > test-results/source-transfer.tar
      - name: Apply checksummed release
        run: python3 maintenance/apply-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and simulation tests
        run: |
          set -o pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          npm test 2>&1 | tee test-results/unit-output.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright==1.62.0
          python -m playwright install --with-deps chromium webkit > test-results/browser-install.txt 2>&1
      - name: Test landscape, prep, models, controls and saves
        run: |
          set -o pipefail
          xvfb-run -a python tests/browser.py 2>&1 | tee test-results/browser-output.txt
      - name: Commit tested source to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests index.html styles.css manifest.webmanifest package.json release.json README.md sw.js update.html
          if ! git diff --cached --quiet; then
            git commit -m 'Deadblock 1.2.0: landscape guard, solid heads, wave preparation and runway'
            git push origin HEAD:deadblock-landscape-prep-1-2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-release-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
