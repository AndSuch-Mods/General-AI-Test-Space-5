name: Prepare and test mobile update
on:
  push:
    branches: [deadblock-mobile-1-1]
    paths: ['maintenance/**', '.github/workflows/mobile-update.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked release changes
        run: python3 maintenance/apply_mobile_update.py
      - name: Syntax and simulation tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browsers
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify mobile controls and saves
        run: |
          mkdir -p test-results
          set -o pipefail
          xvfb-run -a python tests/browser.py 2>&1 | tee test-results/browser-output.txt
      - name: Commit tested source to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html styles.css sw.js update.html release.json package.json tests README.md
          git commit -m 'Deadblock 1.1.0: manual controls, compact HUD, larger arenas, art and pickups'
          git push origin HEAD:deadblock-mobile-1-1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-update-test-results
          path: test-results
          if-no-files-found: ignore
