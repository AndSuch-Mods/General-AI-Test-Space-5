name: 3D visual review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - run: xvfb-run -a python tests/webgl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: test-results
