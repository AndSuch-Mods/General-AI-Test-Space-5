name: Verify 3D overhaul
on:
  push:
    branches: [deadblock-3d-1-4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deadblock-webgl
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed renderer integration
        run: |
          if [ -f scripts/apply_3d_integration.py ]; then python scripts/apply_3d_integration.py; fi
          mkdir -p test-results
          git diff 30994df7b8619d77960790af276aad53dd7229cc --stat | tee test-results/changes.txt
          test -z "$(git diff 30994df7b8619d77960790af276aad53dd7229cc --name-only -- src/engine.js src/storage.js src/defenses.js)"
      - name: Syntax and simulation regression tests
        run: |
          set -o pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test 2>&1 | tee test-results/simulation-output.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - name: Render seven models and stress the actual WebGL scene
        id: webgl
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run -a python tests/webgl.py 2>&1 | tee test-results/webgl-output.txt
      - name: Mobile controls, preparation, rotation, saves and offline play
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run -a python tests/browser.py 2>&1 | tee test-results/browser-output.txt
      - name: Require both browser suites to pass
        if: steps.webgl.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
      - name: Commit tested readable integration to the build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests index.html styles.css models.html sw.js package.json release.json README.md update.html .github/workflows/verify.yml
          if [ -f scripts/apply_3d_integration.py ]; then git rm scripts/apply_3d_integration.py; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and verify real 3D models, oblique WebGL camera and save-safe 1.4.0 release'
            git push origin HEAD:deadblock-3d-1-4
          fi
          git rev-parse HEAD | tee test-results/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadblock-3d-checks
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadblock-3d-source
          include-hidden-files: true
          path: |
            vendor
            src
            assets
            scripts
            tests
            index.html
            models.html
            styles.css
            icon.png
            icon.svg
            manifest.webmanifest
            sw.js
            release.json
            package.json
            README.md
            update.html
            .github/workflows
            .nojekyll
