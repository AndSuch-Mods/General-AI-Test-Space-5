name: Verify Deadblock
on:
  push:
    branches: [deadblock-ios-survival-20260912]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with:
          name: deadblock-source
          path: |
            src
            index.html
            styles.css
            manifest.webmanifest
            sw.js
            icon.svg
            README.md
            tests
          if-no-files-found: error
