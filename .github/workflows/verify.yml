name: Verify Deadblock
on:
  push:
    branches: [deadblock-ios-survival-20260912, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deadblock-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and simulation tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - name: Test layouts, controls, save lifecycle, and offline play
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadblock-test-results
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadblock-source
          include-hidden-files: true
          path: |
            src
            index.html
            styles.css
            manifest.webmanifest
            sw.js
            icon.svg
            icon.png
            README.md
            package.json
            tests
            .nojekyll
            .github/workflows/verify.yml
          if-no-files-found: error
