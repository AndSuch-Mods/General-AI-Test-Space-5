name: Verify Deadblock
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deadblock-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, simulation, persistence and mesh tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          mkdir -p test-results
          set -o pipefail
          npm test | tee test-results/simulation-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-checks
          path: test-results
  browser:
    needs: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [webgl, browser]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browsers
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - name: Run actual browser checks
        run: |
          mkdir -p test-results
          set -o pipefail
          xvfb-run -a python tests/${{ matrix.suite }}.py 2>&1 | tee test-results/${{ matrix.suite }}-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-checks
          path: test-results
  live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install WebKit
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps webkit
      - name: Verify the actual published GitHub Pages game
        run: |
          mkdir -p test-results
          set -o pipefail
          xvfb-run -a python tests/live.py 2>&1 | tee test-results/live-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-checks
          path: test-results
