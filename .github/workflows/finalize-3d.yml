name: Commit verified 3D source
on:
  push:
    branches: [deadblock-3d-1-4]
    paths: [.github/workflows/finalize-3d.yml]
permissions:
  contents: write
  actions: read
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10370556451'
          run-id: 34899512714
          github-token: ${{ github.token }}
          path: /tmp/tested-source
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10370476575'
          run-id: 34899512714
          github-token: ${{ github.token }}
          path: /tmp/tested-checks
          merge-multiple: true
      - name: Verify and import the exact reviewed source, excluding workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('/tmp/tested-source');checks=Path('/tmp/tested-checks');root=Path.cwd()
          webgl=json.loads((checks/'webgl-results.json').read_text())
          browser=json.loads((checks/'results.json').read_text())
          assert len(webgl)==2 and all(r['passed'] for r in webgl)
          assert len(browser)==10 and all(r['passed'] for r in browser)
          log=(checks/'simulation-output.txt').read_text()
          assert '# tests 102' in log and '# pass 102' in log and '# fail 0' in log
          digest=hashlib.sha256();files=[]
          for p in sorted(source.rglob('*')):
              if not p.is_file():continue
              rel=p.relative_to(source)
              if '.github' in rel.parts or '__pycache__' in rel.parts or p.suffix=='.pyc':continue
              digest.update(str(rel).encode()+b'\0'+p.read_bytes()+b'\0');files.append(rel)
          assert digest.hexdigest()=='7ab44b58d7156cd11b950e27c7a21e2098cc9dc5c54243a8cea8c4a9da9c4ae5',digest.hexdigest()
          for rel in files:
              target=root/rel;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source/rel,target)
          for name in ['scripts/apply_3d_integration.py','scripts/refine_3d_art.py']:(root/name).unlink(missing_ok=True)
          report={'version':'1.4.0','sourceRun':34899512714,'sourceArtifact':10370556451,'reviewedSourceSha256':digest.hexdigest(),'unitTests':{'passed':102,'failed':0},'webgl':webgl,'browser':browser,'note':'All tests passed. Original workflow failed only when its token attempted to commit a workflow file. This import commits the exact tested source; workflow files are updated separately through the authorized connector.'}
          (root/'tests/release-1.4-evidence.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Imported',len(files),'verified files')
          PY
          test -z "$(git diff 30994df7b8619d77960790af276aad53dd7229cc --name-only -- src/engine.js src/storage.js src/defenses.js)"
          npm test
      - name: Commit source without changing workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests vendor scripts index.html models.html styles.css sw.js package.json release.json README.md update.html
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'Publish exact browser-tested 1.4.0 WebGL models and integration'
          git push origin HEAD:deadblock-3d-1-4
          git rev-parse HEAD
