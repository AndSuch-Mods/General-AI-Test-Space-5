<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18241e"><title>Update Deadblock</title>
<style>html{color-scheme:dark;font-family:system-ui;background:#18241e;color:#eeeedd}body{margin:0;padding:48px 24px;max-width:480px;margin-inline:auto}h1{font-size:34px;margin-bottom:8px}p{line-height:1.6;color:#c9d5bc}button,a{display:block;padding:15px 20px;border:1px solid #7c8b67;border-radius:5px;color:#18241e;background:#d4e982;text-decoration:none;text-align:center;font:700 16px system-ui;margin:18px 0;min-height:48px;box-sizing:border-box}button{width:100%}button:disabled{opacity:.5}small{color:#acb79e}#status{min-height:54px}</style></head>
<body><small>ANDSUCH / ARCADE · VERSION 1.1.0</small><h1>Update Deadblock</h1><p>Pause any open game first. This loads the new game files without clearing your saved run, purchases, settings, or records.</p><button id="install">Load the updated game</button><p id="status" role="status" aria-live="polite">Internet access is needed for the update.</p><a href="./">Return to game</a>
<script>
const button=document.getElementById('install'),status=document.getElementById('status');
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Checking and caching version 1.1.0…';
 try{
  if(!('serviceWorker'in navigator))throw Error('This browser does not support offline installation.');
  const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  await reg.update();
  const deadline=Date.now()+45000;
  while(Date.now()<deadline){
   if(reg.waiting){reg.waiting.postMessage({type:'ACTIVATE_UPDATE'});}
   const names=await caches.keys();
   if(names.includes('deadblock-survival-1.1.0')&&reg.active?.state==='activated'&&!reg.waiting&&!reg.installing){
    // The activating worker has already claimed clients. Navigation uses its complete cache.
    await navigator.serviceWorker.ready;
    status.textContent='Update ready. Opening the game…';
    location.replace('./?v=1.1.0');return;
   }
   await new Promise(resolve=>setTimeout(resolve,300));
  }
  throw Error('The update did not finish. Check your connection and try again.');
 }catch(error){status.textContent=error.message;button.disabled=false;}
});
</script></body></html>
